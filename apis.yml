name: Softheon
description: >-
  Softheon is a healthcare technology company that provides SaaS software for
  health plans, brokers, and government agencies to run shopping and enrollment,
  billing and payments, member renewals, reporting and analytics, and compliance
  across the ACA marketplace, ICHRA, dental, and Medicare Advantage markets. Its
  all-in-one platform automates health-insurance administration end to end and is
  increasingly layering in agentic AI to streamline operations at scale. Founded
  around 2000 and headquartered in Stony Brook, New York, Softheon operates a
  developer portal (developer.softheon.com) and a compliance trust center, and is
  backed by Norwest Venture Partners.
